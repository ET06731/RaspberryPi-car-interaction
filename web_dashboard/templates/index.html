<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能小车控制台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 智能小车控制台</h1>
            <div class="status-bar">
                <a href="/monitor" style="color: white; margin-right: 15px;">🌡️ 系统监控</a>
                <span class="status-indicator" id="connectionStatus">● 已连接</span>
            </div>
        </header>

        <main>
            <!-- 传感器数据显示 -->
            <section class="sensor-panel">
                <h2>传感器数据</h2>
                <div class="sensor-grid">
                    <div class="sensor-item">
                        <label>超声波距离</label>
                        <span id="distanceValue" class="value">--</span>
                        <span class="unit">cm</span>
                    </div>
                    <div class="sensor-item">
                        <label>当前速度</label>
                        <span id="speedValue" class="value">80</span>
                        <span class="unit">%</span>
                    </div>
                </div>
            </section>

            <!-- 速度控制 -->
            <section class="control-panel">
                <h2>速度控制</h2>
                <div class="speed-control">
                    <input type="range" id="speedSlider" min="0" max="100" value="80">
                    <div class="speed-labels">
                        <span>慢</span>
                        <span id="speedDisplay">80%</span>
                        <span>快</span>
                    </div>
                </div>
            </section>

            <!-- 方向控制 -->
            <section class="control-panel">
                <h2>方向控制</h2>
                <div class="direction-pad">
                    <div class="d-pad-row">
                        <button class="btn-dir" data-direction="spin_left" title="原地左转">
                            ↺
                        </button>
                        <button class="btn-dir btn-primary" data-direction="forward" title="前进">
                            ▲
                        </button>
                        <button class="btn-dir" data-direction="spin_right" title="原地右转">
                            ↻
                        </button>
                    </div>
                    <div class="d-pad-row">
                        <button class="btn-dir" data-direction="left" title="左转">
                            ◀
                        </button>
                        <button class="btn-dir btn-stop" data-direction="stop" title="停止">
                            ■
                        </button>
                        <button class="btn-dir" data-direction="right" title="右转">
                            ▶
                        </button>
                    </div>
                    <div class="d-pad-row">
                        <button class="btn-dir" data-direction="backward" title="后退">
                            ▼
                        </button>
                    </div>
                </div>
            </section>

            <!-- 蜂鸣器控制 -->
            <section class="control-panel">
                <h2>蜂鸣器</h2>
                <div class="buzzer-buttons compact">
                    <button class="btn-action btn-sm" onclick="window.carController.playBuzzer('short')">短</button>
                    <button class="btn-action btn-sm" onclick="window.carController.playBuzzer('double')">两声</button>
                    <button class="btn-action btn-sm" onclick="window.carController.playBuzzer('long')">长</button>
                </div>
            </section>

            <!-- 风扇控制 -->
            <section class="control-panel">
                <h2>风扇控制</h2>
                <div class="fan-buttons">
                    <button class="btn-action btn-on" onclick="window.carController.controlFan('on')">开启</button>
                    <button class="btn-action btn-off" onclick="window.carController.controlFan('off')">关闭</button>
                </div>
            </section>

            <!-- 舵机控制 -->
            <section class="control-panel">
                <h2>云台舵机</h2>
                <div class="servo-control">
                    <div class="servo-row">
                        <label>上下:</label>
                        <input type="range" id="servoUpDown" min="0" max="180" value="90" onchange="window.carController.setServo('up_down', this.value)">
                        <span id="servoUpDownVal">90°</span>
                    </div>
                    <div class="servo-row">
                        <label>左右:</label>
                        <input type="range" id="servoLeftRight" min="0" max="180" value="90" onchange="window.carController.setServo('left_right', this.value)">
                        <span id="servoLeftRightVal">90°</span>
                    </div>
                    <button class="btn-action" onclick="window.carController.setServo('center', 90)">回中</button>
                </div>
            </section>

            <!-- RGB LED 控制 -->
            <section class="control-panel">
                <h2>RGB 彩灯</h2>
                <div class="rgb-control">
                    <div class="rgb-presets">
                        <button class="btn-rgb" style="background:#ff0000" onclick="window.carController.setRgbPreset('red')"></button>
                        <button class="btn-rgb" style="background:#00ff00" onclick="window.carController.setRgbPreset('green')"></button>
                        <button class="btn-rgb" style="background:#0000ff" onclick="window.carController.setRgbPreset('blue')"></button>
                        <button class="btn-rgb" style="background:#ffff00" onclick="window.carController.setRgbPreset('yellow')"></button>
                        <button class="btn-rgb" style="background:#00ffff" onclick="window.carController.setRgbPreset('cyan')"></button>
                        <button class="btn-rgb" style="background:#ff00ff" onclick="window.carController.setRgbPreset('magenta')"></button>
                        <button class="btn-rgb" style="background:#ff8800" onclick="window.carController.setRgbPreset('orange')"></button>
                        <button class="btn-rgb" style="background:#ff69b4" onclick="window.carController.setRgbPreset('pink')"></button>
                    </div>
                    <div class="rgb-custom">
                        <div>
                            <label>R</label>
                            <input type="range" id="rgbRed" min="0" max="255" value="0" onchange="window.carController.setRgbColor()">
                        </div>
                        <div>
                            <label>G</label>
                            <input type="range" id="rgbGreen" min="0" max="255" value="0" onchange="window.carController.setRgbColor()">
                        </div>
                        <div>
                            <label>B</label>
                            <input type="range" id="rgbBlue" min="0" max="255" value="0" onchange="window.carController.setRgbColor()">
                        </div>
                    </div>
                    <button class="btn-action btn-off" onclick="window.carController.setRgbPreset('off')">关闭</button>
                </div>
            </section>

            <!-- 摄像头控制 -->
            <section class="control-panel">
                <h2>摄像头预览</h2>
                <div class="camera-buttons">
                    <button class="btn-action btn-start" id="cameraStartBtn" onclick="window.carController.controlCamera('start')">开启</button>
                    <button class="btn-action btn-stop" id="cameraStopBtn" onclick="window.carController.controlCamera('stop')">关闭</button>
                </div>
            </section>

            <!-- 手势互动程序控制 -->
            <section class="control-panel">
                <h2>手势互动程序</h2>
                <div class="gesture-buttons">
                    <button class="btn-action btn-start" id="gestureStartBtn" onclick="window.carController.controlGesture('start')">启动</button>
                    <button class="btn-action btn-stop" id="gestureStopBtn" onclick="window.carController.controlGesture('stop')">停止</button>
                    <span id="gestureStatus" class="status-text">未运行</span>
                </div>
            </section>

            <!-- 键盘快捷键说明 -->
            <section class="help-panel">
                <h2>键盘快捷键</h2>
                <div class="shortcuts">
                    <div class="shortcut"><kbd>W</kbd> / <kbd>↑</kbd> 前进</div>
                    <div class="shortcut"><kbd>S</kbd> / <kbd>↑</kbd> 后退</div>
                    <div class="shortcut"><kbd>A</kbd> / <kbd>←</kbd> 左转</div>
                    <div class="shortcut"><kbd>D</kbd> / <kbd>→</kbd> 右转</div>
                    <div class="shortcut"><kbd>Q</kbd> 原地左转</div>
                    <div class="shortcut"><kbd>E</kbd> 原地右转</div>
                    <div class="shortcut"><kbd>Space</kbd> 停止</div>
                </div>
            </section>
        </main>

        <footer>
            <p>智能小车控制系统 v1.0 | 端口: 5000</p>
        </footer>
    </div>

    <!-- 摄像头预览浮窗 -->
    <div id="cameraPopup" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: none;">
        <img id="cameraVideo" style="width: 320px; height: 240px; border: 3px solid #3498db; border-radius: 8px; background: #000; object-fit: cover;">
        <button onclick="window.carController.controlCamera('stop')" style="position: absolute; top: -10px; right: -10px; background: #e74c3c; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer;">×</button>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
